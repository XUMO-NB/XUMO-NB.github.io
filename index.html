        /* ========== 液态玻璃按钮样式 ========== */
        .btn {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 25px;
            font-weight: 500;
            letter-spacing: 0.3px;
            padding: 8px 16px;
            margin: 4px 6px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            font-size: 0.9rem;
            position: relative;
            overflow: hidden;
            color: #2c3e50;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.6);
        }
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* 不同按钮的色彩区分 */
        .btn-primary { background: rgba(102, 126, 234, 0.25); border-color: rgba(102, 126, 234, 0.4); color: #2c3e50; }
        .btn-primary:hover { background: rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: rgba(80, 80, 80, 0.25); border-color: rgba(120, 120, 120, 0.4); color: #2c3e50; }
        .btn-secondary:hover { background: rgba(80, 80, 80, 0.4); }
        .btn-success { background: rgba(17, 153, 142, 0.25); border-color: rgba(17, 153, 142, 0.4); color: #1a7a72; }
        .btn-success:hover { background: rgba(17, 153, 142, 0.4); }
        .btn-warning { background: rgba(240, 147, 251, 0.25); border-color: rgba(240, 147, 251, 0.4); color: #6d2e7a; }
        .btn-warning:hover { background: rgba(240, 147, 251, 0.4); }
        .btn-info { background: rgba(79, 172, 254, 0.25); border-color: rgba(79, 172, 254, 0.4); color: #1a5276; }
        .btn-info:hover { background: rgba(79, 172, 254, 0.4); }

        /* 涟漪动画 */
        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: ripple 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }

        /* 去除栅格类的强制宽度 */
        .btn[class*="col-lg"] { flex: 0 0 auto; width: auto; max-width: none; }
        @media (max-width: 767.98px) { .btn { display: inline-block; width: auto; margin: 4px 4px; } }

    <script>
        // 弹窗逻辑
        $('#kaygb-limestart').on('click', function(e) {
            e.preventDefault();
            layer.open({
                type: 2, title: 'Blog', shadeClose: true, anim: 4,
                closeBtn: 2, isOutAnim: false,
                area: ['80%', '90%'],
                content: 'https://www.limestart.cn/'
            });
        });
        $('#kaygb-mail').on('click', function(e) {
            e.preventDefault();
            var mailUrl = $(this).attr('href');
            layer.open({
                type: 2, title: 'Send Mail', shadeClose: true, anim: 4,
                closeBtn: 2, isOutAnim: false,
                area: ['80%', '90%'],
                content: mailUrl
            });
        });

        // 涟漪动效
        $(document).on('click', '.btn', function(e) {
            e.stopPropagation();
            var $btn = $(this);
            $btn.find('.ripple-effect').remove();
            var offset = $btn.offset();
            var x = e.pageX - offset.left;
            var y = e.pageY - offset.top;
            var $ripple = $('<span class="ripple-effect"></span>');
            var size = Math.max($btn.outerWidth(), $btn.outerHeight());
            $ripple.css({
                width: size, height: size,
                left: x - size/2, top: y - size/2
            });
            $btn.append($ripple);
            $ripple.on('animationend', function() { $(this).remove(); });
        });
    </script>

    <script type="text/javascript"> 
        /* 鼠标文字特效 */
        var a_idx = 0; 
        jQuery(document).ready(function($) { 
            $("body").click(function(e) { 
                var a = new Array("富强", "民主", "文明", "和谐", "自由", "平等", "公正" ,"法治", "爱国", "敬业", "诚信", "友善"); 
                var $i = $("<span/>").text(a[a_idx]); 
                a_idx = (a_idx + 1) % a.length; 
                var x = e.pageX, 
                y = e.pageY; 
                $i.css({ 
                    "z-index": 999999999999999999999999999999999999999999999999999999999999999999999, 
                    "top": y - 20, 
                    "left": x, 
                    "position": "absolute", 
                    "font-weight": "bold", 
                    "color": "#ff6651" 
                }); 
                $("body").append($i); 
                $i.animate({ 
                    "top": y - 180, 
                    "opacity": 0 
                }, 1500, function() { 
                    $i.remove(); 
                }); 
            }); 
        }); 
    </script>
